<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  .stage{
    width:1200px;height:675px;background:#0B0C0B;
    position:relative;overflow:hidden;font-family:Arial,sans-serif;
    background-image: radial-gradient(ellipse 650px 500px at 85% 30%, rgba(0,200,5,0.12), transparent 70%);
  }
  .eyebrow{position:absolute;top:60px;left:70px;font-family:ui-monospace,monospace;font-size:16px;color:#00C805;letter-spacing:0.14em;}
  h1{position:absolute;top:96px;left:70px;width:1000px;font-size:48px;font-weight:800;line-height:1.15;margin:0;color:#EDEEF0;}
  .body{position:absolute;top:260px;left:70px;width:640px;font-size:19px;color:#9BA1A6;line-height:1.55;}
  .content{position:absolute;top:260px;left:70px;width:1060px;}
  .footer{position:absolute;bottom:56px;left:70px;font-family:ui-monospace,monospace;font-size:15px;color:#00C805;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .chip{font-family:ui-monospace,monospace;font-size:14px;color:#EDEEF0;border:1px solid #1B1D1B;border-radius:10px;padding:12px 18px;background:#0F1113;}
  .chip b{color:#00C805;}
  .check{display:flex;align-items:center;gap:12px;font-size:17px;color:#EDEEF0;margin-bottom:12px;}
  .check .mark{color:#00C805;font-weight:800;width:22px;}
  .cross{display:flex;align-items:center;gap:12px;font-size:17px;color:#4A4F54;margin-bottom:12px;}
  .cross .mark{color:#4A4F54;font-weight:800;width:22px;}
  .cols{display:flex;gap:60px;}
  .col{width:460px;}
  .col h3{font-family:ui-monospace,monospace;font-size:14px;letter-spacing:0.06em;margin:0 0 16px;}

<div class="stage">
  <div class="eyebrow">LIVE ON PONS</div>

  <div class="content" style="top:250px;">
    <div class="row">
      <div class="chip"><b>$INTERN/ETH</b> &mdash; live on Pons, Robinhood Chain</div>
    </div>
    <div class="body" style="position:static;width:900px;margin-top:24px;">Pre-graduation, price comes from Pons's own bonding curve, not a locked pool &mdash; it graduates into a permanent Uniswap V4 pool once the curve raises 4.2 ETH.</div>
  </div>
