<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0B0C0B;}
  .stage{width:1024px;height:1024px;display:flex;align-items:center;justify-content:center;background:#0B0C0B;}
</style>
</head>
<body>
<div class="stage">
<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyGrad" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3DFF4A"/>
      <stop offset="55%" stop-color="#00C805"/>
      <stop offset="100%" stop-color="#009104"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B9740E"/>
      <stop offset="55%" stop-color="#D9A441"/>
      <stop offset="100%" stop-color="#FFE49A"/>
    </linearGradient>
  </defs>

  <!-- soft ember glow behind the mascot -->
  <ellipse cx="450" cy="480" rx="380" ry="340" fill="#D9A441" opacity="0.10"/>

  <!-- main blob body -->
  <path d="M450 90
           C 660 90, 795 245, 795 470
           C 795 675, 655 830, 450 830
           C 245 830, 105 675, 105 470
           C 105 245, 240 90, 450 90 Z"
        fill="url(#bodyGrad)" stroke="#052B02" stroke-width="16"/>

  <!-- tummy shade -->
  <path d="M450 560 C 560 560, 630 610, 630 690 C 630 750, 550 780, 450 780
           C 350 780, 270 750, 270 690 C 270 610, 340 560, 450 560 Z"
        fill="#00A604" opacity="0.55"/>

  <!-- lanyard straps -->
  <path d="M340 210 L300 470" stroke="#1B1D1B" stroke-width="20" stroke-linecap="round"/>
  <path d="M560 210 L600 470" stroke="#1B1D1B" stroke-width="20" stroke-linecap="round"/>

  <!-- name tag -->
  <g>
    <rect x="368" y="455" width="164" height="108" rx="16" fill="#EDEEF0" stroke="#1B1D1B" stroke-width="10"/>
    <circle cx="450" cy="487" r="14" fill="#9BA1A6"/>
    <rect x="392" y="516" width="116" height="14" rx="7" fill="#9BA1A6"/>
    <rect x="404" y="538" width="92" height="10" rx="5" fill="#C7CBCE"/>
  </g>

  <!-- eyes -->
  <ellipse cx="358" cy="360" rx="84" ry="96" fill="#F7FBF4" stroke="#052B02" stroke-width="10"/>
  <ellipse cx="542" cy="360" rx="84" ry="96" fill="#F7FBF4" stroke="#052B02" stroke-width="10"/>
  <circle cx="380" cy="382" r="34" fill="#0B0C0B"/>
  <circle cx="564" cy="382" r="34" fill="#0B0C0B"/>
  <circle cx="392" cy="368" r="11" fill="#ffffff"/>
  <circle cx="576" cy="368" r="11" fill="#ffffff"/>

  <!-- tired brow lines for that "overworked intern" charm -->
  <path d="M296 292 Q356 262 410 288" stroke="#052B02" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M604 292 Q544 262 490 288" stroke="#052B02" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- small open mouth -->
  <ellipse cx="450" cy="430" rx="26" ry="20" fill="#052B02"/>

  <!-- rosy cheeks -->
  <ellipse cx="300" cy="410" rx="26" ry="16" fill="#00E60A" opacity="0.5"/>
  <ellipse cx="600" cy="410" rx="26" ry="16" fill="#00E60A" opacity="0.5"/>

  <!-- ember spark above head, referencing the burn mechanic -->
  <g transform="translate(560,150) rotate(12)">
    <path d="M0 70 C -34 40, -30 -10, 0 -60 C 30 -10, 34 40, 0 70 Z" fill="url(#flameGrad)" stroke="#7A4A08" stroke-width="6"/>
    <path d="M0 40 C -14 24, -12 0, 0 -26 C 12 0, 14 24, 0 40 Z" fill="#FFF3D0"/>
  </g>
</svg>
</div>
</body>
</html>
