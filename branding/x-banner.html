<style>
  html,body{margin:0;padding:0;}
  .stage{
    width:1500px;height:500px;background:#0B0C0B;
    position:relative;overflow:hidden;
    background-image: radial-gradient(ellipse 800px 500px at 88% 30%, rgba(0,200,5,0.14), transparent 70%),
                       radial-gradient(ellipse 500px 400px at 15% 10%, rgba(217,164,65,0.07), transparent 70%);
  }
  .dot{position:absolute;width:5px;height:5px;border-radius:50%;background:#00C805;opacity:0.5;}
  /*
    X overlays the profile-photo circle on the banner's BOTTOM-LEFT corner
    (roughly the bottom ~180px of the left ~320px, worst case across web +
    mobile app crops) -- text placed there gets covered, which is exactly
    what happened to the previous version ("Supply" and part of the tagline
    were hidden behind the avatar). Fix: anchor everything to the TOP of
    the banner with a big bottom margin, and start well right of the
    avatar's max width. Never re-draw the mascot in the banner itself --
    the avatar sitting right next to it already is the mascot; drawing it
    twice is what made the previous version feel cluttered.
  */
  .text{
    position:absolute;left:150px;top:64px;width:1140px;
    font-family:Arial,sans-serif;color:#EDEEF0;
  }
  .eyebrow{
    font-family:ui-monospace,monospace;
    font-size:18px;color:#00C805;letter-spacing:0.12em;margin:0 0 16px;
  }
  h1{font-size:56px;font-weight:700;line-height:1.12;margin:0 0 18px;}
  h1 em{font-style:normal;color:#D9A441;}
  p.tag{font-size:23px;color:#9BA1A6;margin:0;line-height:1.4;width:820px;}
  .ember{
    position:absolute;right:120px;top:150px;width:220px;height:220px;opacity:0.16;
  }
</style>
<div class="stage">
  <div class="dot" style="top:50px;left:1180px;"></div>
  <div class="dot" style="top:430px;left:900px;"></div>
  <div class="dot" style="top:90px;left:1380px;"></div>
  <svg class="ember" viewBox="-40 -65 80 140" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#B9740E"/>
        <stop offset="55%" stop-color="#D9A441"/>
        <stop offset="100%" stop-color="#FFE49A"/>
      </linearGradient>
    </defs>
    <path d="M0 70 C -34 40, -30 -10, 0 -60 C 30 -10, 34 40, 0 70 Z" fill="url(#flameGrad)"/>
  </svg>
  <div class="text">
    <p class="eyebrow">ROBINHOOD CHAIN &middot; PONS &middot; $INTERN</p>
    <h1>Interns run on power.<br><em>Supply</em> runs down.</h1>
    <p class="tag">Fixed 1B supply. Every intern hired burns $INTERN on the spot.</p>
  </div>
</div>
