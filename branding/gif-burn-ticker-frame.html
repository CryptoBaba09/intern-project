<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  .stage{
    width:1080px;height:1080px;background:#0B0C0B;

    background-image: radial-gradient(ellipse 700px 600px at 50% 45%, rgba(0,200,5,0.12), transparent 70%);

    position:absolute;top:340px;left:0;width:1080px;text-align:center;

    display:flex;align-items:center;justify-content:center;gap:14px;
  }
  .dot{width:14px;height:14px;border-radius:50%;background:#00C805;}
  .num{
    position:absolute;top:400px;left:0;width:1080px;text-align:center;
    font-family:ui-monospace,monospace;font-size:100px;font-weight:700;color:#EDEEF0;
    letter-spacing:-2px;
  }
  .label{
    position:absolute;top:540px;left:0;width:1080px;text-align:center;
    font-family:ui-monospace,monospace;font-size:26px;color:#9BA1A6;
  }
  .footer{
    position:absolute;top:960px;left:0;width:1080px;text-align:center;
    font-family:ui-monospace,monospace;font-size:20px;color:#4A4F54;
  }
</style>
<div class="stage">
  <div class="eyebrow"><span class="dot"></span>LIVE · READ DIRECTLY FROM CHAIN</div>
  <div class="num">{{NUM}}</div>
  <div class="label">$INTERN BURNED, PERMANENTLY</div>
  <div class="footer">internburn.xyz — verify it yourself</div>
</div>
